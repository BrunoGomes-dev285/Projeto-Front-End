<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.C.U. - Centro de Controle Unificado</title>
    
    <!-- Favicon da pasta public servido na raiz -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
                <svg width="24" height="24" class="bi" aria-hidden="true"><use href="/icons.svg#logo"></use></svg>
                C.C.U. - Centro de Controle Unificado
            </span>
        </div>
    </nav>

    <!-- Grid Responsivo Principal -->
    <div class="container-fluid px-4">
        <div class="row">
            
            <!-- Coluna Esquerda: Status e Alertas -->
            <div class="col-12 col-lg-4 mb-4">
                
                <div class="card bg-light shadow mb-4">
                    <div class="card-header bg-primary text-white fw-bold">
                        Status de Roteamento de Rede
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            Protocolo OSPF
                            <span class="badge bg-success rounded-pill">Ativo</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            Sessão BGP
                            <span class="badge bg-success rounded-pill">Estabelecida</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            Latência Média
                            <span class="badge bg-info text-dark rounded-pill">12 ms</span>
                        </li>
                    </ul>
                </div>

                <div class="card bg-light shadow">
                    <div class="card-header bg-danger text-white fw-bold">
                        Alertas Críticos
                    </div>
                    <div class="card-body">
                        <p class="card-text text-danger fw-semibold">Nenhum alerta crítico detectado no sistema.</p>
                    </div>
                </div>

            </div>    

            <!-- Coluna Direita: Animação de Telemetria -->
            <div class="col-12 col-lg-8 mb-4">
                <div class="card border-0 shadow-lg">
                    <div class="card-header bg-secondary text-white fw-bold">
                        Telemetria de Testes em Pista
                    </div>
                    <div class="card-body p-0">
                        <div id="cenario">
                            <div class="sol">☀️</div>
                            <div class="nuvens">☁️</div>
                            <div class="arvores">
                                <span>🌲</span>
                                <span>🌳</span>
                                <span>🌲</span>
                                <span>🌳</span>
                            </div>
                            <div class="veiculo">🏎️</div>
                            <div class="estrada"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
